<header class="topbar">
  <a class="brand" href="{{ index_href }}">← 网站首页</a>
  <span class="r-brand-tag">精读</span>
  <span class="spacer"></span>
  {{ theme_bar }}
</header>

<main class="reader-wrap">
  <div class="issue-head r-head">
    <p class="eyebrow">英中对照精读 · <a href="{{ issue_href }}">本期原版</a></p>
    <h1>{{ heading }}</h1>
    <p class="meta">已精读 {{ count }} / 全期 {{ total }} 篇；看中哪篇点「点单」，会打开 GitHub 提交一条点单记录，周五晚自动任务会一并做掉</p>
  </div>

  <ul class="reading-list">
    {{ items }}
  </ul>
</main>

<div id="order-toast" class="order-toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var toast = document.getElementById("order-toast");
  var timer = null;
  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest(".order-btn");
    if (!btn) return;
    var text = btn.getAttribute("data-order") || "";
    // 先给反馈；随后浏览器打开 GitHub 新建 Issue 页（锚点默认跳转）
    toast.textContent = "正在打开 GitHub 点单页，登录后点 Submit 即可";
    toast.classList.add("show");
    clearTimeout(timer);
    timer = setTimeout(function () { toast.classList.remove("show"); }, 2600);
    function fallback(t) {
      var ta = document.createElement("textarea");
      ta.value = t;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { fallback(text); });
    } else {
      fallback(text);
    }
  });
})();
</script>

{{ footer }}

<button id="to-top" class="to-top" type="button" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
    <path d="M12 19V6M12 6l-6 6M12 6l6 6" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
