<header class="topbar">
  <a class="brand" href="{{ index_href }}">← 首页</a>
  <span class="r-brand-tag">精读</span>
  <span class="spacer"></span>
  {{ theme_bar }}
</header>

<main class="reader-wrap">
  <div class="issue-head r-head">
    <p class="eyebrow">{{ section }} · 英中对照精读</p>
    <h1>{{ title }}</h1>
    <p class="r-title-zh">{{ title_zh }}</p>
    <p class="meta">
      <a href="{{ issue_href }}">本期原版</a>
      <a href="{{ toc_href }}">本期精读目录</a>
    </p>
  </div>

  <div class="reader-body">
    {{ body }}
  </div>

  <details class="vocab">
    <summary>生词表（{{ gloss_count }} 条，点开查看）</summary>
    <div class="vocab-grid">
      {{ vocab }}
    </div>
  </details>
</main>

{{ footer }}

<div id="wg-card" role="dialog" aria-label="词条讲解" hidden>
  <div class="wg-term"><b id="wg-term"></b><span id="wg-ph"></span></div>
  <div class="wg-line"><span id="wg-pos" class="wg-pos"></span><span id="wg-sense"></span></div>
  <div class="wg-note" id="wg-note" hidden></div>
</div>

<button id="to-top" class="to-top" type="button" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
    <path d="M12 19V6M12 6l-6 6M12 6l6 6" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
